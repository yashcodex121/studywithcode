<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Samadhan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap');
:root {
  --bg: #DEE2E8;
  --ink: #1B2130;
  --primary: #3D6FF2;
  --primary-dark: #1E3FCB;
  --teal: #2FA98C;
  --coral: #E0574A;
  --line: rgba(255,255,255,0.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh; background: var(--bg); font-family: 'Inter', sans-serif;
  color: var(--ink); position: relative; overflow-x: hidden; padding-bottom: 48px;
}
.fraunces { font-family: 'Fraunces', serif; }
.kalam { font-family: 'Kalam', cursive; }
button { cursor: pointer; font-family: inherit; border: none; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
textarea, input { font-family: inherit; }
::selection { background: var(--primary); color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }
.spinner {
  display: inline-block; width: 15px; height: 15px;
  border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 9px;
}
.plus {
  position: fixed; font-size: 22px; color: #6B7688; opacity: 0.35;
  font-weight: 300; line-height: 1; pointer-events: none; z-index: 1;
}
.blob { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.primary-btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; padding: 13px 28px; border-radius: 999px; font-weight: 700; font-size: 15px;
  transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 10px 24px rgba(61,111,242,0.4);
}
.primary-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(61,111,242,0.5); }
.ghost-btn {
  background: rgba(255,255,255,0.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #fff; border: 1px solid var(--line); padding: 11px 22px; border-radius: 999px;
  font-weight: 600; font-size: 14px; transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
}
.ghost-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.26); transform: translateY(-1px); }
.glass-card {
  background: linear-gradient(135deg, rgba(180,190,205,0.45), rgba(61,111,242,0.55));
  backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.55); box-shadow: 0 30px 60px rgba(30,40,70,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
  border-radius: 24px; color: #fff;
}
.glass-input { background: transparent; border: none; outline: none; width: 100%; color: #fff; resize: vertical; }
.glass-input::placeholder { color: rgba(255,255,255,0.7); }
.glass-light {
  background: rgba(255,255,255,0.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.55);
}
.nav-btn { border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; background: transparent; color: rgba(27,33,48,0.6); transition: all 0.2s ease; }
.nav-btn.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
.time-btn { padding: 9px 16px; font-size: 13.5px; font-weight: 600; border-radius: 20px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.1); color: #fff; transition: all 0.15s ease; }
.time-btn.active { border-color: #fff; background: rgba(255,255,255,0.9); color: var(--primary-dark); }
.option-btn { text-align: left; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 14.5px; width: 100%; transition: all 0.15s ease; }
.option-btn:hover:not(:disabled) { transform: translateX(3px); }
.option-btn.correct { background: rgba(47,169,140,0.35); border-color: var(--teal); }
.option-btn.wrong { background: rgba(224,87,74,0.3); border-color: var(--coral); }
.option-btn.selected { background: rgba(255,255,255,0.3); border-color: #fff; }
.tab-panel { animation: fadeUp 0.35s cubic-bezier(0.2,0.7,0.3,1) both; }
.sticky-card { transition: transform 0.2s ease, box-shadow 0.2s ease; animation: popIn 0.4s cubic-bezier(0.2,0.8,0.3,1.1) both; }
.sticky-card:hover { transform: translateY(-4px) scale(1.02) !important; box-shadow: 0 14px 26px rgba(0,0,0,0.28); }
.container { max-width: 900px; margin: 0 auto; padding: 32px 24px 0; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="blob" style="top:-180px;right:-220px;width:620px;height:620px;background:radial-gradient(circle, rgba(30,55,170,0.55), rgba(30,55,170,0) 70%);"></div>
<div class="blob" style="bottom:-260px;left:-260px;width:640px;height:640px;background:radial-gradient(circle, rgba(10,12,20,0.55), rgba(10,12,20,0) 70%);"></div>
<div class="blob" style="top:30%;left:60%;width:320px;height:320px;background:radial-gradient(circle, rgba(90,130,240,0.25), transparent 70%);"></div>

<span class="plus" style="top:150px;left:150px;">+</span>
<span class="plus" style="top:150px;right:160px;color:#4C5A78;opacity:0.4;">+</span>
<span class="plus" style="bottom:140px;right:170px;">+</span>

<header style="position: relative; z-index: 1;">
  <div class="container" style="padding-top:40px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;">
      <div>
        <h1 class="fraunces" style="font-size:36px;font-weight:700;margin:0;letter-spacing:-0.01em;">Samadhan</h1>
        <p style="margin:6px 0 0;font-size:14.5px;color:rgba(27,33,48,0.6);">From doubt, to notes, to quiz.</p>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <div class="glass-light" style="min-width:200px;border-radius:16px;padding:10px 16px;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;">
            <span class="fraunces" id="rankName" style="font-size:15px;font-weight:600;color:var(--primary-dark);">Novice</span>
            <span id="rankXp" style="font-size:12.5px;color:rgba(27,33,48,0.55);">0 / 120 XP</span>
          </div>
          <div style="width:200px;height:6px;background:rgba(27,33,48,0.12);border-radius:3px;overflow:hidden;">
            <div id="rankBar" style="width:0%;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:3px;transition:width 0.5s;"></div>
          </div>
        </div>
        <div class="glass-light" style="border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px;">
          <img id="userAvatar" src="" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;display:none;background:rgba(27,33,48,0.15);" />
          <span id="userName" style="font-size:13.5px;font-weight:600;color:var(--ink);">…</span>
          <button id="logoutBtn" onclick="logout()" style="background:transparent;color:rgba(27,33,48,0.55);font-size:12px;font-weight:600;padding:4px 8px;">Logout</button>
        </div>
      </div>
    </div>
    <nav class="glass-light" style="display:inline-flex;gap:4px;margin-top:24px;border-radius:999px;padding:4px;">
      <button class="nav-btn active" data-tab="solve">Solve</button>
      <button class="nav-btn" data-tab="board">Sticky Board</button>
      <button class="nav-btn" data-tab="quiz">Quiz</button>
    </nav>
  </div>
</header>

<main class="container" style="padding-top:32px;">

  <section id="panel-solve" class="tab-panel">
    <h2 class="fraunces" style="font-size:24px;font-weight:600;margin:0 0 12px;">Write your doubt</h2>
    <div class="glass-card" style="padding:20px 22px;margin-bottom:28px;">
      <textarea id="doubtInput" class="glass-input" rows="4" placeholder="Ask anything..." style="font-size:15.5px;line-height:1.5;"></textarea>
      <div style="display:flex;gap:12px;margin-top:16px;align-items:center;justify-content:flex-end;flex-wrap:wrap;">
        <button class="ghost-btn" onclick="document.getElementById('doubtInput').value=''">Cancel</button>
        <button id="solveBtn" class="primary-btn" onclick="handleSolve()">Solve Doubt</button>
      </div>
    </div>
    <div id="solveResult"></div>
  </section>

  <section id="panel-board" class="tab-panel" style="display:none;">
    <h2 class="fraunces" style="font-size:24px;font-weight:600;margin:0 0 6px;">Sticky Board</h2>
    <p style="font-size:14px;color:rgba(27,33,48,0.6);margin:0 0 24px;">Notes you've pinned for revision.</p>
    <div id="boardGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px;"></div>
  </section>

  <section id="panel-quiz" class="tab-panel" style="display:none;">
    <h2 class="fraunces" style="font-size:24px;font-weight:600;margin:0 0 6px;">Quiz</h2>
    <p style="font-size:14px;color:rgba(27,33,48,0.6);margin:0 0 20px;">Give any topic, pick your time per question, and earn XP for speed and accuracy.</p>
    <div id="quizArea"></div>
  </section>

</main>

<script>
const STICKY_COLORS = [
  { bg: '#F4CD46', tape: '#E0B233' },
  { bg: '#8FC1B5', tape: '#6FA898' },
  { bg: '#F2A6A0', tape: '#DB8B85' },
  { bg: '#C9B6E4', tape: '#AD95CC' },
];
const TIME_OPTIONS = [10, 15, 20, 30, 45, 60];
const LEVELS = [
  { name: 'Novice', min: 0 }, { name: 'Learner', min: 120 }, { name: 'Scholar', min: 320 },
  { name: 'Expert', min: 650 }, { name: 'Master', min: 1100 }, { name: 'Guru', min: 1800 }, { name: 'Legend', min: 2800 },
];

const memoryStore = {};
function storageGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch (e) { return key in memoryStore ? memoryStore[key] : fallback; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { memoryStore[key] = value; }
}

let stickyNotes = [];
let totalXp = 0;
let currentUser = null;
let timeLimit = 20, timerId = null, timeLeft = 20;
let quizQuestions = null, quizIndex = 0, quizSelected = null, quizShowAnswer = false, quizAnswers = [], quizXpGains = [];

function getRank(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].min) idx = i;
  const cur = LEVELS[idx], next = LEVELS[idx + 1];
  const progress = next ? Math.min(100, Math.round((xp - cur.min) / (next.min - cur.min) * 100)) : 100;
  return { name: cur.name, next, progress, xp };
}

function renderRank() {
  const r = getRank(totalXp);
  document.getElementById('rankName').textContent = r.name;
  document.getElementById('rankXp').textContent = r.next ? `${r.xp} / ${r.next.min} XP` : `${r.xp} XP · max rank`;
  document.getElementById('rankBar').style.width = r.progress + '%';
}

function addXp(n) {
  return fetch('/api/xp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gain: n }),
  })
    .then(r => r.json())
    .then(data => { totalXp = data.xp; renderRank(); })
    .catch(() => {});
}

async function loadMe() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login.html'; return; }
    currentUser = await res.json();
    totalXp = currentUser.xp || 0;
    document.getElementById('userName').textContent = currentUser.name || 'Student';
    if (currentUser.avatar) {
      const img = document.getElementById('userAvatar');
      img.src = currentUser.avatar;
      img.style.display = 'inline-block';
    }
    renderRank();
  } catch (e) {
    window.location.href = '/login.html';
  }
}

function logout() {
  fetch('/auth/logout', { method: 'POST' }).finally(() => { window.location.href = '/login.html'; });
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['solve', 'board', 'quiz'].forEach(t => {
      document.getElementById('panel-' + t).style.display = t === btn.dataset.tab ? 'block' : 'none';
    });
    if (btn.dataset.tab === 'board') renderBoard();
  });
});

async function solveDoubt(doubt) {
  const res = await fetch('/api/solve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ doubt }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Server se explanation nahi mil paya.');
  }
  return res.json();
}

async function fetchQuiz(topic) {
  const res = await fetch('/api/quiz', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ topic }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || 'Server se quiz nahi ban paya.');
  }
  return res.json();
}

async function handleSolve() {
  const doubt = document.getElementById('doubtInput').value.trim();
  if (!doubt) return;
  const btn = document.getElementById('solveBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Solving...';
  document.getElementById('solveResult').innerHTML = '';
  let result;
  try {
    result = await solveDoubt(doubt);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Solve Doubt';
    document.getElementById('solveResult').innerHTML = `
      <div class="glass-card tab-panel" style="padding:20px 22px;">
        <p style="margin:0;font-size:14.5px;color:#FFE3DF;">⚠ ${e.message}</p>
      </div>`;
    return;
  }
  btn.disabled = false;
  btn.textContent = 'Solve Doubt';
  document.getElementById('solveResult').innerHTML = `
    <div class="glass-card tab-panel" style="padding:28px 28px 24px;">
      <h3 class="fraunces" style="font-size:20px;font-weight:600;margin:0 0 12px;">Explanation</h3>
      <div style="font-size:15px;line-height:1.7;white-space:pre-line;color:rgba(255,255,255,0.9);">${result.explanation}</div>
      <div style="border-top:1px solid rgba(255,255,255,0.25);margin:22px 0 18px;"></div>
      <h3 class="fraunces" style="font-size:18px;font-weight:600;margin:0 0 10px;">Short Notes</h3>
      <ul class="kalam" style="margin:0;padding-left:22px;font-size:17px;line-height:1.9;">
        ${result.shortNotes.map(n => `<li>${n}</li>`).join('')}
      </ul>
      <div style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;">
        <button class="primary-btn" onclick='pinNotes(${JSON.stringify(result.shortNotes)}, this)'>Pin to Sticky Board</button>
        <button class="ghost-btn" onclick="document.querySelector('[data-tab=quiz]').click(); startQuiz('${doubt.slice(0, 60).replace(/'/g, '')}')">Quiz Me on This</button>
      </div>
    </div>`;
}

async function pinNotes(notes, btnEl) {
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="spinner"></span>Pinning...';
  const base = stickyNotes.length;
  const payload = notes.map((text, i) => ({
    text,
    color: STICKY_COLORS[(base + i) % STICKY_COLORS.length],
    rotation: (Math.random() * 6 - 3).toFixed(1),
  }));
  try {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: payload }),
    });
    if (!res.ok) throw new Error('save failed');
    const data = await res.json();
    stickyNotes.push(...data.notes);
    btnEl.textContent = 'Pinned to board ✓';
    btnEl.style.background = 'rgba(255,255,255,0.2)';
    btnEl.style.boxShadow = 'none';
  } catch (e) {
    btnEl.disabled = false;
    btnEl.textContent = 'Pin to Sticky Board (retry)';
  }
}

async function loadNotes() {
  try {
    const res = await fetch('/api/notes');
    if (!res.ok) return;
    const data = await res.json();
    stickyNotes = data.notes;
  } catch (e) {}
}

function renderBoard() {
  const grid = document.getElementById('boardGrid');
  grid.innerHTML = `<div class="glass-light" style="grid-column:1/-1;border-radius:20px;padding:24px;text-align:center;color:rgba(27,33,48,0.55);font-size:14px;"><span class="spinner" style="border-top-color:var(--ink);border-color:rgba(27,33,48,0.2);"></span>Loading...</div>`;
  loadNotes().then(() => {
    if (!stickyNotes.length) {
      grid.innerHTML = `<div class="glass-light" style="grid-column:1/-1;border-style:dashed;border-radius:20px;padding:40px 24px;text-align:center;color:rgba(27,33,48,0.55);font-size:14.5px;">The board is empty. Solve a doubt and pin its notes here.</div>`;
      return;
    }
    grid.innerHTML = stickyNotes.map(n => `
      <div class="sticky-card" style="background:${n.color.bg};color:#2B2410;border-radius:4px;padding:20px 16px 16px;min-height:140px;position:relative;transform:rotate(${n.rotation}deg);box-shadow:0 12px 24px rgba(30,40,70,0.18);">
        <span style="position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);width:46px;height:16px;background:${n.color.tape};opacity:0.85;display:block;"></span>
        <p class="kalam" style="margin:0;font-size:16.5px;line-height:1.45;">${n.text}</p>
        <button onclick="removeSticky('${n.id}')" style="position:absolute;bottom:8px;right:10px;background:transparent;border:none;font-size:12.5px;font-weight:700;color:rgba(43,36,16,0.55);">remove ✕</button>
      </div>`).join('');
  });
}

async function removeSticky(id) {
  stickyNotes = stickyNotes.filter(n => String(n.id) !== String(id));
  renderBoard();
  try { await fetch('/api/notes/' + id, { method: 'DELETE' }); }
  catch (e) {}
}

function renderQuizSetup() {
  document.getElementById('quizArea').innerHTML = `
    <div class="glass-card" style="padding:24px;">
      <input id="quizTopic" class="glass-input" placeholder="Ask anything..." style="font-size:15px;padding:4px;" />
      <div style="margin-top:22px;">
        <p style="font-size:12.5px;font-weight:600;color:rgba(255,255,255,0.7);margin:0 0 10px;">Time per question</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="timeOptions">
          ${TIME_OPTIONS.map(t => `<button class="time-btn ${t === timeLimit ? 'active' : ''}" onclick="setTimeLimit(${t}, this)">${t}s</button>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:22px;justify-content:flex-end;">
        <button class="ghost-btn" onclick="document.getElementById('quizTopic').value=''">Cancel</button>
        <button id="genQuizBtn" class="primary-btn" onclick="generateQuizFromInput()">Generate Quiz</button>
      </div>
    </div>`;
}

function setTimeLimit(t, el) {
  timeLimit = t;
  document.querySelectorAll('#timeOptions .time-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function generateQuizFromInput() {
  const topic = document.getElementById('quizTopic').value.trim();
  if (!topic) return;
  startQuiz(topic);
}

async function startQuiz(topic) {
  const btn = document.getElementById('genQuizBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Building quiz...'; }
  else {
    document.getElementById('quizArea').innerHTML = `<div class="glass-card" style="padding:40px;text-align:center;"><span class="spinner"></span>Building quiz...</div>`;
  }
  let data;
  try {
    data = await fetchQuiz(topic);
  } catch (e) {
    document.getElementById('quizArea').innerHTML = `
      <div class="glass-card" style="padding:28px;text-align:center;">
        <p style="margin:0 0 16px;font-size:14.5px;color:#FFE3DF;">⚠ ${e.message}</p>
        <button class="ghost-btn" onclick="renderQuizSetup()">Try Again</button>
      </div>`;
    return;
  }
  quizQuestions = data.questions;
  quizIndex = 0; quizAnswers = []; quizXpGains = []; quizSelected = null; quizShowAnswer = false;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  clearInterval(timerId);
  if (quizIndex >= quizQuestions.length) return renderQuizResults();
  const q = quizQuestions[quizIndex];
  timeLeft = timeLimit;
  quizSelected = null; quizShowAnswer = false;

  document.getElementById('quizArea').innerHTML = `
    <div class="glass-card tab-panel" style="padding:26px 26px 22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span style="font-size:12.5px;font-weight:600;color:#CFE0FF;">Question ${quizIndex + 1} / ${quizQuestions.length}</span>
        <span id="timerText" style="font-size:12.5px;font-weight:700;color:rgba(255,255,255,0.85);">${timeLeft}s</span>
      </div>
      <div style="width:100%;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;overflow:hidden;margin-bottom:18px;">
        <div id="timerBar" style="width:100%;height:100%;background:#fff;transition:width 1s linear;"></div>
      </div>
      <h3 class="fraunces" style="font-size:19px;font-weight:600;margin:0 0 18px;line-height:1.4;">${q.question}</h3>
      <div style="display:flex;flex-direction:column;gap:10px;" id="optionsWrap">
        ${q.options.map((opt, i) => `<button class="option-btn" onclick="selectOption(${i})" data-i="${i}">${opt}</button>`).join('')}
      </div>
      <div id="answerFeedback"></div>
      <div style="margin-top:20px;" id="quizActionArea">
        <button class="primary-btn" id="confirmBtn" onclick="confirmAnswer()" disabled>Confirm Answer</button>
      </div>
    </div>`;

  timerId = setInterval(() => {
    timeLeft--;
    const timerText = document.getElementById('timerText');
    const timerBar = document.getElementById('timerBar');
    const isLow = timeLeft <= Math.ceil(timeLimit * 0.25);
    if (timerText) {
      timerText.textContent = timeLeft + 's';
      timerText.style.color = isLow ? '#FFB4AA' : 'rgba(255,255,255,0.85)';
    }
    if (timerBar) {
      timerBar.style.width = (timeLeft / timeLimit * 100) + '%';
      timerBar.style.background = isLow ? 'var(--coral)' : '#fff';
    }
    if (timeLeft <= 0) { clearInterval(timerId); confirmAnswer(true); }
  }, 1000);
}

function selectOption(i) {
  if (quizShowAnswer) return;
  quizSelected = i;
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector(`.option-btn[data-i="${i}"]`).classList.add('selected');
  document.getElementById('confirmBtn').disabled = false;
}

function confirmAnswer(timedOut) {
  if (quizShowAnswer) return;
  clearInterval(timerId);
  quizShowAnswer = true;
  const q = quizQuestions[quizIndex];
  const sel = timedOut ? (quizSelected === null ? -1 : quizSelected) : quizSelected;
  const correct = sel === q.correctIndex;
  const fast = timeLeft > timeLimit / 2;
  const gain = correct ? (fast ? 25 : 15) : 0;
  quizAnswers.push(sel);
  quizXpGains.push(gain);
  document.querySelectorAll('.option-btn').forEach(b => {
    const i = parseInt(b.dataset.i, 10);
    if (i === q.correctIndex) b.classList.add('correct');
    else if (i === sel) b.classList.add('wrong');
    b.disabled = true;
  });
  document.getElementById('answerFeedback').innerHTML = `
    <div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <p style="font-size:13.5px;color:rgba(255,255,255,0.85);line-height:1.5;margin:0;flex:1;min-width:200px;">${q.explanation}</p>
      <span style="font-size:13px;font-weight:700;color:${gain > 0 ? '#0F3D30' : '#4A1712'};background:${gain > 0 ? '#BFEBDD' : '#F7C9C1'};padding:4px 10px;border-radius:12px;">${gain > 0 ? '+' + gain + ' XP' : '+0 XP'}</span>
    </div>`;
  document.getElementById('quizActionArea').innerHTML = `<button class="primary-btn" onclick="quizIndex++; renderQuizQuestion();">${quizIndex + 1 === quizQuestions.length ? 'See Results' : 'Next Question'}</button>`;
}

async function renderQuizResults() {
  const score = quizAnswers.reduce((acc, a, i) => acc + (a === quizQuestions[i].correctIndex ? 1 : 0), 0);
  const sessionXp = quizXpGains.reduce((a, b) => a + b, 0);
  const before = getRank(totalXp).name;
  await addXp(sessionXp);
  const after = getRank(totalXp).name;
  document.getElementById('quizArea').innerHTML = `
    <div class="glass-card tab-panel" style="padding:32px 28px;text-align:center;">
      <p style="font-size:13px;color:#CFE0FF;font-weight:600;margin:0 0 6px;">Quiz Complete</p>
      <h3 class="fraunces" style="font-size:34px;font-weight:700;margin:0 0 8px;">${score} / ${quizQuestions.length}</h3>
      <p style="font-size:14.5px;color:rgba(255,255,255,0.85);margin:0 0 4px;">
        ${score === quizQuestions.length ? 'Perfect score — everything is clear.' : score >= quizQuestions.length / 2 ? 'Good work — revise a couple of points.' : 'Go over the notes again, then try once more.'}
      </p>
      <p style="font-size:13.5px;color:#fff;font-weight:700;margin:4px 0 20px;">+${sessionXp} XP earned</p>
      ${after !== before ? `<div style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:14px;">Rank up: <strong>${before}</strong> → <strong>${after}</strong></div>` : ''}
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="primary-btn" onclick="renderQuizSetup()">New Quiz</button>
        <button class="ghost-btn" onclick="document.querySelector('[data-tab=solve]').click()">Solve Another Doubt</button>
      </div>
    </div>`;
}

loadMe();
renderQuizSetup();
</script>
</body>
</html>
